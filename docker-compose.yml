services:
  web:
    depends_on:
      - db
    tty: true
    image: theoden714/badge_reader:latest
    
    network_mode: "host"
    
    ports:
      - "4000:4000"
    volumes:
      - ./badge_reader:/app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  db:
    image: postgres:14
    ports:
      - "5432:5432"
    restart: always
    shm_size: 128mb
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: