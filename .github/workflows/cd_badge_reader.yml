name: cd_badge_reader

on:
    push:
        branches: ["main"]

jobs:
    production:
        runs-on: ubuntu-latest

        steps:
            - name: Ecriture shh key
              run:
                echo "${{ secrets.SSH_KEY_AWS }}" > key.pem
                chmod 400 key.pem
                
            - name: Conection Ec2
              run: ssh -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.IP_AWS }}

            - name: Sortir de l'Ec2
              run: exit

            - name: Supression de la clef
              run: rm -f key.pem