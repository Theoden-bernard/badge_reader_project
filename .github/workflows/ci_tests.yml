name: CI

on:
    push:
        branches: ["develop"]
    
    pull_request:
        branches: ["main", "develop"] 

env:
    MIX_ENV: test

jobs:
    test:
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: ./badge_reader

      env:
        POSTGRES_USERNAME: "postgres"
        POSTGRES_PASSWORD: "postgres"
        POSTGRES_DATABASE: "badge_reader_test"

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "postgres"
            POSTGRES_DB: "badge_reader_test"
          options: >-
            --health-cmd "pg_isready -U postgres -d badge_reader_test"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 5432:5432
      
      steps:
          - uses: actions/checkout@v7 

          - name: Set up Elixir & Erlang
            uses: erlef/setup-beam@v1
            with:
              elixir-version: "1.18"
              otp-version: "27"

          - name: Restore dependencies cache
            uses: actions/cache@v4
            with:
              path: badge_reader/deps
              key: ${{ runner.os }}-mix-${{ hashFiles('badge_reader/**/mix.lock') }}
              restore-keys: ${{ runner.os }}-mix-

          - name: Install dependencies
            run: mix deps.get

          - name: Setup Database
            run: |
              mix ecto.create
              mix ecto.migrate
              mix run priv/repo/seeds.exs

          - name: Compile
            run: mix compile --warnings-as-errors

          - name: Run tests
            run: mix quality

    build_and_push_image:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Clonage du repo
              uses: actions/checkout@v7
          
            - name: Installation docker
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.LOGIN }}
                password: ${{ secrets.PASSWORD }}

            - name: Build & Push
              uses: docker/build-push-action@v6
              with:
                context: ./badge_reader
                push: true
                tags: ${{ secrets.LOGIN }}/badge_reader:latest