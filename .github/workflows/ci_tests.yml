name: test_action

on:
    push:
        branches: ["develop"]
    
    pull_request:
        branches: ["main", "develop"] 

jobs:
    elixir_ci:
        runs-on: ubuntu-latest
    
        steps:
            - name: Clonage du repo
              uses: actions/checkout@v3

            - name: Instalation d'Elixir et Erlan
              uses: erlef/setup-beam@v1
              with:
                elixir-version: '1.18' 
                otp-version: '27'
            
            - name: Installation des dépendances Mix
              working-directory: ./badge_reader
              run: mix deps.get